# Local data store for the DRIFTVEIL API. Production uses Render Postgres via DATABASE_URL.
services:
  db:
    image: postgres:17-alpine
    container_name: DRIFTviel
    environment:
      POSTGRES_DB: driftveil
      POSTGRES_USER: driftveil
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5433:5432"]
    volumes: [driftviel-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driftveil -d driftveil"]
      interval: 2s
      retries: 30
volumes:
  driftviel-data:
